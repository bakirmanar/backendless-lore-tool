<mat-toolbar>
  <span class="brand">Lore Tool</span>

  <span class="spacer"></span>

  @if (stateService.authorizedAsOwner()) {
    <a mat-button routerLink="/users">Users</a>
    <a mat-button routerLink="/tags">Tags</a>
    <button mat-button (click)="exportJSON()">&#10515; Export JSON</button>
    <button mat-button (click)="importJSON()">&#10514; Import JSON</button>
  }
  @if (stateService.authorized()) {
    <button mat-icon-button aria-label="Clear passphrase" (click)="clearPassphrase()">
      <mat-icon>logout</mat-icon>
    </button>
  } @else {
    <button mat-icon-button aria-label="Set passphrase" (click)="openPassphraseDialog()">
      <mat-icon>vpn_key</mat-icon>
    </button>
  }
</mat-toolbar>
