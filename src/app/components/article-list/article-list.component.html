<section class="filters">
  <mat-form-field appearance="outline">
    <mat-label>Search</mat-label>
    <input matInput [formControl]="search" placeholder="Find by title" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Type</mat-label>
    <mat-select [formControl]="typeFilter">
      <mat-option [value]="null">All</mat-option>
      <mat-option [value]="ArticleType.CHARACTER">Character</mat-option>
      <mat-option [value]="ArticleType.LOCATION">Location</mat-option>
      <mat-option [value]="ArticleType.FACTION">Faction</mat-option>
      <mat-option [value]="ArticleType.HISTORICAL_EVENT">Historical Event</mat-option>
    </mat-select>
  </mat-form-field>
</section>

<mat-nav-list>
  @for (a of filtered(); track a.id) {
    <a mat-list-item [routerLink]="['/article', a.id]">{{ a.title }}</a>
  }
</mat-nav-list>

@if (stateService.authorizedAsOwner()) {
  <button mat-fab color="primary" class="fab" aria-label="Create article" (click)="goCreate()">
    <mat-icon>add</mat-icon>
  </button>
}
