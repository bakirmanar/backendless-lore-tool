@if (article()) {
  <section class="article-page">
    <header class="page-header">
      <button mat-stroked-button type="button" (click)="back()">
        <mat-icon>arrow_back</mat-icon>
        Back
      </button>

      <span class="spacer"></span>

      @if (stateService.authorizedAsOwner()) {
        <button mat-stroked-button color="primary" type="button" (click)="edit()">
          <mat-icon>edit</mat-icon>
          Edit
        </button>
      }
    </header>

    <app-article-viewer [article]="article()!"></app-article-viewer>
  </section>
} @else {
  <div class="muted">Article not found.</div>
  <button mat-button type="button" (click)="back()">Go Home</button>
}
