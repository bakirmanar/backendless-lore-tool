<section class="editor-overlay">
  <header class="editor-header">
    <button mat-button type="button" (click)="back()">&#8592; Back</button>
    <div class="spacer"></div>
  </header>

  @if (article) {
    <div class="editor-body">
      <app-lore-article [article]="article"></app-lore-article>
    </div>
  } @else {
    <div class="muted">Article not found.</div>
  }
</section>
