<section class="card">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ article.title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @for (sec of article.sections; track $index; let i = $index) {
        <div class="section" [innerHTML]="sec.content | markdown"></div>
      }
    </mat-card-content>
  </mat-card>
</section>
