<div class="wrap">
  <app-header></app-header>
  <header>
    <h1>&#128220; Lore Sheet <span class="pill">Angular &bull; client-side encryption &bull; per-section locks</span></h1>
    <div class="toolbar">
      <button (click)="toggleEdit()" [attr.aria-pressed]="editing()">&#9999;️ Author Mode</button>
      <button (click)="exportJSON()">&#10515; Export JSON</button>
      <button (click)="importJSON()">&#10502; Import JSON</button>
      <button (click)="seedDemo()">&#127793; Seed Demo</button>
    </div>
  </header>

  <div class="grid">
    @for (card of articles(); track card.id) {
      <app-lore-article [article]="card" [editing]="editing()"
        (update)="onUpdate($event)" (remove)="onRemove($event)"></app-lore-article>
    }
  </div>

  <div class="bottom-actions">
    <button (click)="addArticle()">Add Article</button>
    <span class="muted">Changes are saved to your browser until you export.</span>
  </div>


  <p class="muted footer-note">Made for worldbuilders. Zero backend. &#10024;</p>
</div>





<router-outlet></router-outlet>
