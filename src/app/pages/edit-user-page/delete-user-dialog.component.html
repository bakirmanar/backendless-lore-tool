<h2 mat-dialog-title>Delete user?</h2>
<mat-dialog-content>
  <p>Delete {{ data.name }}? This removes their access from future exports and cannot be undone.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" cdkFocusInitial>Cancel</button>
  <button mat-flat-button [mat-dialog-close]="true">Delete user</button>
</mat-dialog-actions>
